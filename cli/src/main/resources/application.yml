spring:
  main:
    banner-mode: "off"
    web-application-type: none
  datasource:
    url: ${TOOLKIT_DB_URL:jdbc:postgresql://localhost:5432/toolkit}
    username: ${TOOLKIT_DB_USER:toolkit}
    password: ${TOOLKIT_DB_PASSWORD:toolkit}
    hikari:
      # Sized per process: several run against one database, so none may hold connections it is not using.
      maximum-pool-size: ${TOOLKIT_DB_POOL:12}
      minimum-idle: 1
      # A lock problem must fail fast and land in the report, never hang a long job.
      connection-init-sql: "SET lock_timeout = '120s'"
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true
  ai:
    mcp:
      server:
        enabled: false
        annotation-scanner:
          enabled: false
  freemarker:
    check-template-location: false
logging:
  level:
    root: WARN
    com.modtoolkit: INFO
