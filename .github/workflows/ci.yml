name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fetch pinned corpora
        run: scripts/fetch-corpora.sh
      - name: Build and test
        run: ./mvnw -B verify
      - name: License gate
        run: python3 scripts/license-check.py
