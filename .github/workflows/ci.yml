name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Tests and the UI e2e stack start their own throwaway PostgreSQL from these binaries, on free ports.
      TOOLKIT_TEST_PG_HOME: /usr/lib/postgresql/17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PostgreSQL 17 with pgvector (PGDG), native
        working-directory: .
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17 postgresql-17-pgvector
      - name: Fetch pinned corpora
        run: scripts/fetch-corpora.sh
      - name: Build and test
        run: ./mvnw -B verify
      - name: License gate
        run: python3 scripts/license-check.py
      - name: Upload test reports and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/*.log
          if-no-files-found: ignore
          retention-days: 14
  ui:
    runs-on: ubuntu-latest
    env:
      # Tests and the UI e2e stack start their own throwaway PostgreSQL from these binaries, on free ports.
      TOOLKIT_TEST_PG_HOME: /usr/lib/postgresql/17
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: PostgreSQL 17 with pgvector (PGDG), native
        working-directory: .
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17 postgresql-17-pgvector
      - name: Fetch pinned corpora
        working-directory: .
        run: scripts/fetch-corpora.sh
      - name: Build the jar
        working-directory: .
        run: ./mvnw -B -q -DskipTests -DskipITs package
      - run: npm ci
      - name: License gate
        run: npm run licenses
      - run: npx playwright install --with-deps chromium
      - name: Build the UI and prove it in a browser
        run: npm run e2e
      - name: Upload e2e stack logs and Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-logs
          path: |
            ui/e2e/.stack/*.log
            ui/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
