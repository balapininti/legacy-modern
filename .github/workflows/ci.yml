name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fetch pinned corpora
        run: scripts/fetch-corpora.sh
      - name: Build and test
        run: ./mvnw -B verify
      - name: License gate
        run: python3 scripts/license-check.py
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Fetch pinned corpora
        working-directory: .
        run: scripts/fetch-corpora.sh
      - name: Build the jar
        working-directory: .
        run: ./mvnw -B -q -DskipTests -DskipITs package
      - run: npm ci
      - name: License gate
        run: npm run licenses
      - run: npx playwright install --with-deps chromium
      - name: Build the UI and prove it in a browser
        run: npm run e2e
  compose-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the images
        run: scripts/build-images.sh
      - name: Install from scratch through a first MCP query
        run: scripts/compose-smoke.sh
